[project]
name = "ha-anio"
version = "0.1.0"
description = "Home Assistant integration for Anio children's watches"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
